[package]
name = "tuipr"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal UI for pull requests on GitHub and Bitbucket Data Center"
repository = "https://github.com/albinlju/tuipr"
license = "MIT"
# Remove to publish to crates.io.
publish = false

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
# Noisy nursery lints: the first hurts readability, the second contradicts
# `unreachable_pub` style and fires on every `pub(crate)` in a private module.
option_if_let_else = "allow"
redundant_pub_crate = "allow"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
ratatui = "0.30.0"
crossterm = { version = "0.29", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "7"
charmed-glamour = "=0.2.4"
ansi-to-tui = "=8.0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
rpassword = "7"
base64 = "0.22"

[profile.release]
strip = true

[profile.dev]
# Faster incremental builds; keeps line tables for backtraces.
debug = 1
