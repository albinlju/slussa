[package]
name = "slussa"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal UI for pull requests on GitHub and Bitbucket Data Center"
repository = "https://github.com/albinlju/slussa"
homepage = "https://github.com/albinlju/slussa"
readme = "README.md"
license = "MIT"
keywords = ["tui", "pull-request", "code-review", "github", "bitbucket"]
categories = ["command-line-utilities", "development-tools"]
# What is only for working on the repository stays out of the published crate.
exclude = [
    ".github/",
    ".coderabbit.yaml",
    "AGENTS.md",
    "CLAUDE.md",
    "clippy.toml",
    "deny.toml",
    "docs/media/",
    "rust-toolchain.toml",
]

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
# Noisy nursery lints: the first hurts readability, the second contradicts
# `unreachable_pub` style and fires on every `pub(crate)` in a private module.
option_if_let_else = "allow"
redundant_pub_crate = "allow"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"
# No panics in non-test code (AGENTS.md); clippy.toml lets tests use them.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# An exception is an `#[expect]` with its reason, so one that is no longer
# needed shows up as a warning instead of lingering.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
ratatui = "0.30.0"
crossterm = { version = "0.29", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "7"
charmed-glamour = "=0.2.4"
ansi-to-tui = "=8.0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
rpassword = "7"
base64 = "0.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.dev]
# Faster incremental builds; keeps line tables for backtraces.
debug = 1
