[package]
name = "tuipr"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
ratatui = "0.30.0"
crossterm = { version = "0.29", features = ["event-stream"] }
