name: Release

# Push a tag like v0.2.0 (or v0.2.0-pre.1 for a prerelease) to build binaries
# and publish a GitHub Release. Run the workflow manually for a dry run: it
# builds and uploads the artifacts but publishes nothing; do that after any
# change to this file.
#
# Before tagging: CI has passed on the commit (this workflow does not re-run the
# tests) and `version` in Cargo.toml, with Cargo.lock, equals the tag without
# the `v`. The first job fails the run if either does not hold; a dry run only
# warns about CI, so that it still shows the check working. Each archive gets
# a `.sha256` and the release a combined `SHA256SUMS`. The crate is published
# by hand with `cargo publish` from the same tag, after this workflow has
# succeeded.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to ask whether CI passed on this commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Nothing here runs the tests, so a tag on a commit CI has not passed
      # would publish untested binaries. Only a run for a push counts: the
      # weekly scheduled run of ci.yml is cargo-deny alone.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --event push --status success \
            --json databaseId --jq 'length')
          if [[ "$passed" -gt 0 ]]; then
            echo "ci.yml passed on ${GITHUB_SHA}."
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "::error::No successful run of ci.yml for a push of ${GITHUB_SHA}. Tag a commit on main that CI has passed; if CI is still running or was cancelled, wait for it or re-run it, then re-run this workflow."
            exit 1
          else
            echo "::warning::Dry run: ci.yml has not passed on a push of ${GITHUB_SHA}, so a tag here would be refused."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
          # ubuntu-22.04 keeps the glibc requirement low (2.35).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: false
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Install the aarch64 Linux cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        run: |
          actual=$(target/${{ matrix.target }}/release/slussa --version)
          test "$actual" = "slussa ${{ needs.verify.outputs.version }}"
      - name: Package
        run: .github/scripts/package.sh ${{ matrix.target }} ${{ needs.verify.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    # Only a pushed tag publishes. A manual run is a dry run on a tag as well.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Combine checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${args[@]}"
