version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # A release is not taken in the days it can still be yanked or found bad.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
